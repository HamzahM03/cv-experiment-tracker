<div id="projects-grid">
  <div class="row">
    {% for project in projects %}
      {% include "components/ProjectCard.html" %}
    {% endfor %}
  </div>

  <div class="d-flex justify-content-between mt-4">
    {% if page > 1 %}
      <a
        class="btn btn-outline-secondary"
        hx-get="/projects/grid?page={{ page - 1 }}"
        hx-target="#projects-grid"
        hx-swap="outerHTML"
        hx-push-url="/projects?page={{ page - 1 }}"
      >
        Previous
      </a>
    {% else %}
      <span></span>
    {% endif %}

    {% if page * page_size < total_count %}
      <a
        class="btn btn-outline-primary"
        hx-get="/projects/grid?page={{ page + 1 }}"
        hx-target="#projects-grid"
        hx-swap="outerHTML"
        hx-push-url="/projects?page={{ page + 1 }}"
      >
        Next
      </a>
    {% endif %}
  </div>
</div>
