<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{{ dataset.name }}</title>
</head>
<script src="https://unpkg.com/htmx.org@2.0.8"></script>
<body>
    <div class="container py-4">
        {% if project %}
            <a href="/projects/{{ project.id }}/detail" class="btn btn-link px-0 mb-3">&larr; Back to {{ project.name }}</a>
        {% endif %}

        <h1>{{ dataset.name }}</h1>

        {% if dataset.description %}
            <p class="lead">{{ dataset.description }}</p>
        {% else %}
            <p class="lead text-muted">No description</p>
        {% endif %}

        <p class="text-muted">
            Created: {{ dataset.created_at.strftime('%b %d, %Y') }}
        </p>

        <h2 class="mt-4">Images</h2>
        {% include "partials/dataset_images_grid.html" %}
    </div>
</body>
</html>
